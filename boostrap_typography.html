<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography in html</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    <div class="container">
        <h2>Typography in bootstrap</h2>
        <h2 class="display-1">Welcome to my page</h2>
        <h2 class="display-2">Welcome to my page</h2>
        <h2 class="display-3">Welcome to my page</h2>
    </div>
    <!--Using small tag in bootstrap-->
    <div class="container">
        <h1>Using muted class in small tag</h1>
        <small class="text-muted">This is muted class</small>
    </div>
    <div class="container">
        <h1>Using Mark Tag</h1>
        <mark>This is highlighted text</mark><br>
        <code>
            Html
        </code>
        <code>
            CSS
        </code>
        <code>
            Js
        </code>
    </div>
</body>
</html>
